require:
  - rubocop-performance

AllCops:
  NewCops: enable
  SuggestExtensions: false
  TargetRubyVersion: 4.0
  Exclude:
    - "db/**/*"
    - "log/**/*"
    - "local_data/**/*"
    - "vendor/**/*"

# ── Layout ────────────────────────────────────────────────────────────────────
Layout/LineLength:
  Max: 150
  AllowedPatterns:
    - '\A\s*#'   # comentarios largos permitidos

# ── Metrics ───────────────────────────────────────────────────────────────────
Metrics/MethodLength:
  Max: 20
  CountAsOne:
    - array
    - hash
    - heredoc

Metrics/BlockLength:
  Enabled: false   # no queremos quejas en bloques DSL (dry-validation, rake tasks, etc.)

Metrics/AbcSize:
  Max: 25

Metrics/CyclomaticComplexity:
  Max: 12

Metrics/PerceivedComplexity:
  Max: 12

Metrics/ClassLength:
  Max: 200

# ── Style ─────────────────────────────────────────────────────────────────────
Style/FrozenStringLiteralComment:
  Enabled: true
  EnforcedStyle: always

Style/Documentation:
  Enabled: false   # sin comentarios de documentación obligatorios en cada clase
