require:
  - rubocop-performance

AllCops:
  NewCops: enable
  SuggestExtensions: false
  TargetRubyVersion: 4.0
  Exclude:
    - "db/schema.rb"
    - "**/log/**/*"
    - "**/local_data/**/*"
    - "**/vendor/**/*"
    - "Rakefile"

# ── Layout ────────────────────────────────────────────────────────────────────
Layout/LineLength:
  Max: 150
  AllowedPatterns:
    - '\A\s*#'   # comentarios largos permitidos

# ── Metrics ───────────────────────────────────────────────────────────────────
Metrics/MethodLength:
  Max: 25
  CountAsOne:
    - array
    - hash
    - heredoc

Metrics/BlockLength:
  Enabled: false   # no queremos quejas en bloques DSL (dry-validation, rake tasks, etc.)

Metrics/AbcSize:
  Max: 30

Metrics/CyclomaticComplexity:
  Max: 12

Metrics/PerceivedComplexity:
  Max: 12

Metrics/ClassLength:
  Max: 200

# ── Style ─────────────────────────────────────────────────────────────────────
Style/FrozenStringLiteralComment:
  Enabled: true
  EnforcedStyle: always

Style/Documentation:
  Enabled: false   # sin comentarios de documentación obligatorios en cada clase

Naming/VariableNumber:
  EnforcedStyle: snake_case

